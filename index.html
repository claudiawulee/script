<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>McGraw Tutoring Tracker</title>
</head>
<body>
  <h1>McGraw Tutoring Tracker</h1>

  <div class="grid">
    <div class="card" data-room="MAT201">
      <div class="room-title">MAT201</div>
      <div class="count">
        <span>Tutors</span>
        <span class="tutors">0</span>
      </div>
      <div class="count">
        <span>Students</span>
        <span class="students">0</span>
      </div>
    </div>

    <div class="card" data-room="MOL214">
      <div class="room-title">MOL214</div>
      <div class="count">
        <span>Tutors</span>
        <span class="tutors">0</span>
      </div>
      <div class="count">
        <span>Students</span>
        <span class="students">0</span>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
